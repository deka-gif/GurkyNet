server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name gurkynet.my.id www.gurkynet.my.id;
    client_max_body_size 20M;

    # React Frontend
    root /var/www/GurkyNet/dist;
    index index.html;

    # Hashed Vite assets — long cache OK (filename changes when content changes).
    # Do not use "always" so 404s are not cached as immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA shell must never be sticky — stale index.html points at deleted chunk hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API
    location /api {
        rewrite ^/api/(.*)$ /index.php last;
    }

    location = /index.php {
        root /var/www/GurkyNet/laravel/public;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/GurkyNet/laravel/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/GurkyNet/laravel/public;

        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    ssl_certificate /etc/letsencrypt/live/gurkynet.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gurkynet.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name gurkynet.my.id www.gurkynet.my.id;

    return 301 https://$host$request_uri;
}
