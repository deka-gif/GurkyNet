# GurkyNet API / App — Nginx (Azure Ubuntu VPS)
# Domain: gurkynet.my.id
# Place under /etc/nginx/sites-available/gurkynet
# Enable: ln -sf /etc/nginx/sites-available/gurkynet /etc/nginx/sites-enabled/gurkynet

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gurkynet.my.id www.gurkynet.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gurkynet.my.id www.gurkynet.my.id;

    # Adjust root if SPA is served separately; Laravel public is the API entrypoint.
    root /var/www/gurkynet/laravel/public;
    index index.php;

    # ssl_certificate     /etc/letsencrypt/live/gurkynet.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gurkynet.my.id/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # --- Upload limit (must be >= app max upload; 413 if request body exceeds this) ---
    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # PHP 8.4-FPM (production stack)
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~* /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/storage/ {
        expires 7d;
        access_log off;
    }
}
