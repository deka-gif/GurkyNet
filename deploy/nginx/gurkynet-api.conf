# GurkyNet API — Nginx (Azure VPS)
# Place under /etc/nginx/sites-available/gurkynet-api

server {
    listen 80;
    listen [::]:80;
    server_name api.gurkynet.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gurkynet.id;

    root /var/www/gurkynet/laravel/public;
    index index.php;

    # ssl_certificate     /etc/letsencrypt/live/api.gurkynet.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.gurkynet.id/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~* /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/storage/ {
        expires 7d;
        access_log off;
    }
}
